<!doctype html>
<html lang="ru" class="export-page">
<head>
  <meta charset="utf-8">
  <title>Gift card artwork export</title>
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/preview-gift.css">
  <link rel="stylesheet" href="css/export-card.css">
</head>
<body class="export-root">
  <div class="gift-card-shell">
    <div class="gift-card">
      <div class="gift-card__stars"></div>
      <div class="gift-card__wash"></div>
      <div class="gift-card__body">
        <div class="gift-card__main">
          <div class="gift-card__david-wrap">
            <img class="gift-card__david" src="img/hero-david.webp" width="1024" height="1024" alt="">
          </div>
          <div class="gift-card__copy">
            <span class="gift-card__demo">ДЕМО / ОБРАЗЕЦ</span>
            <div class="gift-card__label">ПОДАРОЧНАЯ КАРТА</div>
            <div class="gift-card__brand"><span class="gift-card__brand-vr">VR</span> LOUNGE</div>
            <div class="gift-card__city">Кольчугино</div>
            <div class="gift-card__amount">5 000 ₽</div>
            <div class="gift-card__recipient">Для: Артём</div>
          </div>
        </div>
        <footer class="gift-card__footer">
          <div class="gift-card__serial">VR-DEMO-0123 · визуальный образец · не для погашения</div>
        </footer>
      </div>
    </div>
  </div>
</body>
</html>
